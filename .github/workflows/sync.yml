name: Sync with official Zigbee2MQTT app

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/sync.yml]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate instances from the official app
        id: gen
        run: echo "version=$(python3 scripts/sync.py)" >> "$GITHUB_OUTPUT"

      # Lint before committing, so a broken copy never reaches users
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./zigbee2mqtt-2
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./zigbee2mqtt-3
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./zigbee2mqtt-4

      - name: Commit if anything changed
        env:
          VERSION: ${{ steps.gen.outputs.version }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Already in sync with $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync with official Zigbee2MQTT app $VERSION"
          git push
