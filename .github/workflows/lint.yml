name: Lint apps

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [zigbee2mqtt-2, zigbee2mqtt-3, zigbee2mqtt-4]
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.app }}
